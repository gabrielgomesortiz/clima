<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;600;700;800;900&display=swap">

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <div class="search-box">
            <i>
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 384 512" width="28" height="28">
                    <path d="M168 0C75.2 0 0 75.2 0 168c0 87.3 136.3 256 168 256s168-168.7 168-256C336 75.2 260.8 0 168 0zm0 256c-48.6 0-88-39.4-88-88s39.4-88 88-88 88 39.4 88 88-39.4 88-88 88z"/>
                </svg>
            </i>

            <input type="text" placeholder="Enter your location" list="paises">

            <button accesskey="Enter">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 512 512" width="22" height="22">
                        <path d="M505 442.7l-99.7-99.7c28.4-34.9 45.7-79.4 45.7-128.7C451 96.5 354.5 0 231 0S11 96.5 11 214.3 107.5 428.7 231 428.7c49.3 0 93.8-17.3 128.7-45.7l99.7 99.7c4.5 4.5 10.6 7 17 7s12.5-2.5 17-7c9.4-9.4 9.4-24.6 0-34zM231 372.7c-87.3 0-158.3-71-158.3-158.3S143.7 56 231 56s158.3 71 158.3 158.3-71 158.4-158.3 158.4z"/>
                    </svg>
                </i>
            </button>
        </div>

        <div class="not-found">
            <img src="images/lupa_localização.png" alt="lupa_localização">
            <p>Oops! Erro na localização :</p>
        </div>

        <div class="weather-box">
            <img src="" alt="Weather Icon">
            <p class="temperature"></p>
            <p class="descripition"></p>
        </div>

        <div class="weather-details">
            <div class="humidity">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 512 512" width="26" height="26">
                        <path d="M256 0C256 0 0 256 0 384c0 70.7 57.3 128 128 128s128-57.3 128-128S256 0 256 0z"/>
                    </svg>
                </i>
                <div class="text">
                    <span></span>
                    <p>humidity</p>
                </div>
            </div>
            <div class="wind">
                <i>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 512 512" width="26" height="26">
                        <path d="M496 224H32c-17.7 0-32 14.3-32 32s14.3 32 32 32h464c17.7 0 32-14.3 32-32s-14.3-32-32-32z"/>
                    </svg>
                </i>
                <div class="text">
                    <span></span>
                    <p>wind speed</p>
                </div>
            </div>
        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
